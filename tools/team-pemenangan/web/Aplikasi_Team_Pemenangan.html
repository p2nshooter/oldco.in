  --line-2: #eef1f7;

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .05);
  --shadow: 0 4px 6px -2px rgba(16, 24, 40, .05), 0 12px 16px -4px rgba(16, 24, 40, .08);
  --shadow-lg: 0 8px 8px -4px rgba(16, 24, 40, .04), 0 20px 24px -4px rgba(16, 24, 40, .10);

  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  --sidebar: 258px;
  --ease: cubic-bezier(.22, .61, .36, 1);
  --dur: 220ms;
}

/* tema gelap — warna aksen dicerahkan agar tetap kontras di atas latar gelap */
:root[data-theme="dark"] {
  --navy: #91b3ee;
  --navy-600: #a8c4f2;
  --navy-300: #6f92cf;
  --red: #f2879a;
  --red-600: #f6a6b4;
  --gold: #e5be74;
  --green: #6ed3a4;
  --amber: #e8b866;
  --danger: #f78b83;

  --bg: #0d1220;
  --bg-alt: #141c2e;
  --surface: #161e30;
  --surface-2: #1c2740;
  --ink: #e8ecf5;
  --ink-2: #c2cbdc;
  --muted: #94a1b8;
  --line: #29344c;
  --line-2: #222c42;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 6px 16px rgba(0, 0, 0, .45);
  --shadow-lg: 0 18px 40px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size: 14.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.011em; }
p { margin: 0 0 .6em; }
a { color: var(--navy-600); }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

::selection { background: rgba(176, 27, 46, .18); }

/* ---------------------------------------------------------------- kerangka */

.shell {
  display: grid;
  grid-template-columns: var(--sidebar) 1fr;
  height: 100vh;
}

.sidebar {
  background: linear-gradient(180deg, var(--navy) 0%, #0f1d38 100%);
  color: #eaf0fb;
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
  z-index: 20;
}
:root[data-theme="dark"] .sidebar {
  background: linear-gradient(180deg, #101a2e 0%, #0a1120 100%);
  border-right: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 18px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, .10);
}
.brand img {
  width: 46px;
  height: 46px;
  object-fit: contain;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .45));
  flex: none;
}
.brand .txt { min-width: 0; }
.brand .t1 {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand .t2 {
  font-size: 11.5px;
  color: #b9c8e4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px 16px;
  scrollbar-width: thin;
}
.nav-label {
  font-size: 10.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #8ea3c8;
  padding: 14px 10px 6px;
  font-weight: 700;
}
.nav button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 11px;
  margin-bottom: 2px;
  background: transparent;
  border: 0;
  border-radius: var(--r-sm);
  color: #d3ddf0;
  font-size: 13.6px;
  font-weight: 500;
  text-align: left;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease),
    transform 120ms var(--ease);
}
.nav button svg { width: 17px; height: 17px; flex: none; opacity: .92; }
.nav button:hover { background: rgba(255, 255, 255, .09); color: #fff; }
.nav button:active { transform: scale(.985); }
.nav button.on {
  background: rgba(255, 255, 255, .14);
  color: #fff;
  font-weight: 650;
  box-shadow: inset 3px 0 0 var(--gold);
}
.nav button .badge {
  margin-left: auto;
  background: var(--red);
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 999px;
  line-height: 1.6;
}
:root[data-theme="dark"] .nav button .badge { background: #a8253a; color: #fff; }

.side-foot {
  padding: 12px 14px 14px;
  border-top: 1px solid rgba(255, 255, 255, .10);
  font-size: 11.5px;
  color: #9fb2d3;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; flex: none; }

/* ------------------------------------------------------------------ konten */

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 22px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  z-index: 10;
}
.topbar h1 { font-size: 17px; }
.topbar .sub { font-size: 12.2px; color: var(--muted); margin-top: 1px; }
.topbar .grow { flex: 1; }

.icon-btn {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
    transform 120ms var(--ease);
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--navy-300); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 18px; height: 18px; }

.menu-toggle { display: none; }

.view-wrap { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.view { padding: 22px 22px 60px; max-width: 1320px; }
.view[hidden] { display: none; }

.view-enter { animation: viewIn 320ms var(--ease) both; }
@keyframes viewIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

.stagger > * { animation: cardIn 420ms var(--ease) both; }
.stagger > *:nth-child(1) { animation-delay: 20ms; }
.stagger > *:nth-child(2) { animation-delay: 55ms; }
.stagger > *:nth-child(3) { animation-delay: 90ms; }
.stagger > *:nth-child(4) { animation-delay: 125ms; }
.stagger > *:nth-child(5) { animation-delay: 160ms; }
.stagger > *:nth-child(6) { animation-delay: 195ms; }
.stagger > *:nth-child(7) { animation-delay: 230ms; }
.stagger > *:nth-child(8) { animation-delay: 265ms; }
.stagger > *:nth-child(9) { animation-delay: 300ms; }
.stagger > *:nth-child(10) { animation-delay: 335ms; }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px) scale(.99); }
  to { opacity: 1; transform: none; }
}

/* ------------------------------------------------------------------- kartu */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow-sm);
}
.card-h {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line-2);
}
.card-h h3 { font-size: 14px; }
.card-h .grow { flex: 1; }
.card-b { padding: 16px; }

.grid { display: grid; gap: 14px; }
.kpi-grid { grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }

.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 15px 16px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.kpi::after {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--navy-300);
  opacity: .85;
}
.kpi.is-red::after { background: var(--red); }
.kpi.is-gold::after { background: var(--gold); }
.kpi.is-green::after { background: var(--green); }
.kpi .k-top { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.kpi .k-top svg { width: 15px; height: 15px; }
.kpi .k-lab { font-size: 12.2px; font-weight: 600; letter-spacing: .01em; }
.kpi .k-val {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -.02em;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.kpi .k-sub { font-size: 11.8px; color: var(--muted); margin-top: 2px; }

/* ------------------------------------------------------------------ tombol */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 13.4px;
  font-weight: 600;
  white-space: nowrap;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
    transform 110ms var(--ease), box-shadow var(--dur) var(--ease);
}
.btn svg { width: 16px; height: 16px; }
.btn:hover { background: var(--surface-2); border-color: var(--navy-300); }
.btn:active { transform: scale(.97); }
.btn:focus-visible, .icon-btn:focus-visible, .nav button:focus-visible,
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--navy-300);
  outline-offset: 2px;
}
.btn-primary {
  background: var(--navy);
  border-color: var(--navy);
  color: #fff;
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover { background: var(--navy-600); border-color: var(--navy-600); }
:root[data-theme="dark"] .btn-primary { color: #0b1120; }
.btn-red { background: var(--red); border-color: var(--red); color: #fff; }
.btn-red:hover { background: var(--red-600); border-color: var(--red-600); }
:root[data-theme="dark"] .btn-red { color: #2a0710; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--bg-alt); color: var(--ink); }
.btn-sm { padding: 5px 10px; font-size: 12.4px; border-radius: 7px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* ------------------------------------------------------------------- form */

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.4px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 11.4px; color: var(--muted); }
.field .err { font-size: 11.6px; color: var(--danger); font-weight: 600; display: none; }
.field.bad .err { display: block; }

input[type="text"], input[type="date"], input[type="number"], input[type="search"],
select, textarea {
  width: 100%;
  padding: 8px 11px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
input:hover, select:hover, textarea:hover { border-color: var(--navy-300); }
input:focus, select:focus, textarea:focus {
  border-color: var(--navy-600);
  box-shadow: 0 0 0 3px rgba(77, 109, 166, .18);
  outline: none;
}
.field.bad input, .field.bad select {
  border-color: var(--danger);
  box-shadow: 0 0 0 3px rgba(180, 35, 24, .13);
}
textarea { min-height: 62px; resize: vertical; }
select {
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667085' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat: no-repeat;
  background-position: right 9px center;
  background-size: 15px;
  padding-right: 30px;
}

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.form-grid .span2 { grid-column: 1 / -1; }

.search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 380px; }
.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--muted);
  pointer-events: none;
}
.search-wrap input { padding-left: 32px; }

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  align-items: center;
}
.filters select { width: auto; min-width: 132px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.8px;
  font-weight: 650;
  background: var(--bg-alt);
  color: var(--ink-2);
  border: 1px solid var(--line);
}
.chip.aktif { background: rgba(28, 124, 84, .12); color: var(--green); border-color: rgba(28, 124, 84, .3); }
.chip.calon { background: rgba(192, 138, 46, .14); color: var(--amber); border-color: rgba(192, 138, 46, .32); }
.chip.nonaktif { background: rgba(102, 112, 133, .14); color: var(--muted); }
.chip.bad { background: rgba(180, 35, 24, .12); color: var(--danger); border-color: rgba(180, 35, 24, .3); }

/* ------------------------------------------------------------------ tabel */

.tbl-wrap { overflow-x: auto; border-radius: var(--r); }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.2px; }
table.tbl th, table.tbl td {
  padding: 9px 11px;
  text-align: left;
  border-bottom: 1px solid var(--line-2);
  white-space: nowrap;
}
table.tbl thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 11.6px;
  font-weight: 700;
  letter-spacing: .045em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
  user-select: none;
}
table.tbl thead th.sortable { cursor: pointer; }
table.tbl thead th.sortable:hover { color: var(--navy-600); }
table.tbl thead th .arw { opacity: .45; font-size: 10px; }
table.tbl tbody tr { transition: background 140ms var(--ease); }
table.tbl tbody tr:hover { background: var(--surface-2); }
table.tbl tbody tr.warn-row td:first-child { box-shadow: inset 3px 0 0 var(--amber); }
table.tbl tbody tr.bad-row td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.tbl td.name { font-weight: 650; white-space: normal; min-width: 170px; }
table.tbl .row-act { display: flex; gap: 5px; }

.matrix { font-size: 12.4px; }
.matrix th, .matrix td { text-align: center; padding: 6px 8px; }
.matrix tbody th, .matrix td:first-child { text-align: left; font-weight: 650; white-space: nowrap; }
.matrix tfoot td, .matrix tfoot th {
  font-weight: 750;
  background: var(--surface-2);
  border-top: 2px solid var(--line);
}
.matrix td.zero { color: var(--muted); opacity: .45; }

.pager {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 4px 0;
  font-size: 12.6px;
  color: var(--muted);
  flex-wrap: wrap;
}

.empty {
  text-align: center;
  padding: 46px 20px;
  color: var(--muted);
}
.empty svg { width: 42px; height: 42px; opacity: .35; margin-bottom: 10px; }
.empty h4 { font-size: 15px; color: var(--ink-2); margin-bottom: 5px; }

/* ------------------------------------------------------------------ grafik */

.bar-row {
  display: grid;
  grid-template-columns: 108px 1fr 62px;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  font-size: 12.8px;
}
.bar-track {
  display: block;          /* span perlu dijadikan blok agar tinggi berlaku */
  height: 10px;
  background: var(--bg-alt);
  border-radius: 999px;
  overflow: hidden;
}
.bar-fill {
  display: block;          /* tanpa ini lebar animasi tidak pernah terlihat */
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--navy-300), var(--navy-600));
  width: 0;
  transition: width 900ms var(--ease);
}
.bar-fill.g { background: linear-gradient(90deg, #34b880, var(--green)); }
.bar-fill.a { background: linear-gradient(90deg, #e0b062, var(--gold)); }
.bar-fill.r { background: linear-gradient(90deg, #e07182, var(--red)); }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }

.donut { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut svg { flex: none; }
.donut .ring { transition: stroke-dasharray 1s var(--ease); }
.legend { display: flex; flex-direction: column; gap: 7px; font-size: 12.8px; }
.legend i {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  display: inline-block;
  margin-right: 7px;
  vertical-align: -1px;
}

.col-chart { display: flex; align-items: flex-end; gap: 10px; height: 132px; padding-top: 8px; }
.col-chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.col-chart .col .bar {
  background: linear-gradient(180deg, var(--navy-300), var(--navy));
  border-radius: 6px 6px 0 0;
  height: 0;
  transition: height 900ms var(--ease);
  min-height: 3px;
}
.col-chart .col .cap {
  font-size: 10.6px;
  color: var(--muted);
  text-align: center;
  margin-top: 6px;
  line-height: 1.25;
}
.col-chart .col .v { font-size: 11.6px; font-weight: 700; text-align: center; margin-bottom: 4px; }

/* ------------------------------------------------------------------ modal */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(9, 14, 26, .55);
  backdrop-filter: blur(3px);
  display: grid;
  place-items: center;
  padding: 18px;
  z-index: 100;
  animation: fadeIn 180ms var(--ease) both;
}
.overlay[hidden] { display: none; }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

.modal {
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  width: min(720px, 100%);
  max-height: min(88vh, 900px);
  display: flex;
  flex-direction: column;
  animation: modalIn 260ms var(--ease) both;
  border: 1px solid var(--line);
}
.modal.narrow { width: min(460px, 100%); }
@keyframes modalIn {
  from { opacity: 0; transform: translateY(14px) scale(.975); }
  to { opacity: 1; transform: none; }
}
.modal-h {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line-2);
}
.modal-h h3 { font-size: 15.5px; }
.modal-h .grow { flex: 1; }
.modal-b { padding: 18px; overflow-y: auto; }
.modal-f {
  display: flex;
  gap: 9px;
  justify-content: flex-end;
  padding: 14px 18px;
  border-top: 1px solid var(--line-2);
  background: var(--surface-2);
  border-radius: 0 0 var(--r-lg) var(--r-lg);
  flex-wrap: wrap;
}

/* ------------------------------------------------------------------ toast */

.toasts {
  position: fixed;
  right: 18px;
  bottom: 18px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  z-index: 200;
  max-width: min(360px, calc(100vw - 36px));
}
.toast {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--green);
  border-radius: var(--r);
  box-shadow: var(--shadow-lg);
  padding: 11px 14px;
  font-size: 13.2px;
  animation: toastIn 300ms var(--ease) both;
}
.toast.out { animation: toastOut 240ms var(--ease) both; }
.toast.err { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--navy-300); }
.toast svg { width: 17px; height: 17px; flex: none; margin-top: 1px; }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(24px) scale(.97); }
  to { opacity: 1; transform: none; }
}
@keyframes toastOut {
  to { opacity: 0; transform: translateX(24px) scale(.97); }
}

/* --------------------------------------------------------------- petunjuk */

.guide-hero {
  background: linear-gradient(135deg, var(--navy) 0%, #24406f 55%, #3c2233 100%);
  color: #fff;
  border-radius: var(--r-lg);
  padding: 26px 26px 24px;
  display: flex;
  align-items: center;
  gap: 22px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.guide-hero::before {
  content: "";
  position: absolute;
  right: -60px;
  top: -60px;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(224, 176, 98, .32), transparent 65%);
}
.guide-hero img { width: 92px; height: 92px; object-fit: contain; flex: none; position: relative; }
.guide-hero h2 { font-size: 21px; margin-bottom: 5px; }
.guide-hero p { color: #cfdcf3; margin: 0; font-size: 13.6px; max-width: 62ch; }

.steps { counter-reset: st; display: grid; gap: 12px; }
.step {
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 14px;
  align-items: start;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 15px 16px;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
    border-color var(--dur) var(--ease);
}
.step:hover {
  transform: translateX(3px);
  box-shadow: var(--shadow);
  border-color: var(--navy-300);
}
.step::before {
  counter-increment: st;
  content: counter(st);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(140deg, var(--navy), var(--navy-600));
  color: #fff;
  font-weight: 800;
  font-size: 15px;
}
:root[data-theme="dark"] .step::before { color: #0b1120; }
.step h4 { font-size: 14.4px; margin-bottom: 3px; }
.step p { color: var(--ink-2); font-size: 13.2px; margin: 0; }

.tip {
  display: flex;
  gap: 11px;
  padding: 13px 15px;
  border-radius: var(--r);
  background: rgba(192, 138, 46, .10);
  border: 1px solid rgba(192, 138, 46, .28);
  font-size: 13.2px;
  color: var(--ink-2);
}
.tip svg { width: 18px; height: 18px; color: var(--gold); flex: none; margin-top: 1px; }
.tip.blue { background: rgba(77, 109, 166, .10); border-color: rgba(77, 109, 166, .3); }
.tip.blue svg { color: var(--navy-600); }
.tip.red { background: rgba(176, 27, 46, .09); border-color: rgba(176, 27, 46, .27); }
.tip.red svg { color: var(--red); }

.faq { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.faq details { border-bottom: 1px solid var(--line-2); background: var(--surface); }
.faq details:last-child { border-bottom: 0; }
.faq summary {
  padding: 13px 16px;
  cursor: pointer;
  font-weight: 650;
  font-size: 13.6px;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 9px;
  transition: background 160ms var(--ease);
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::before {
  content: "";
  width: 8px;
  height: 8px;
  border-right: 2px solid var(--navy-300);
  border-bottom: 2px solid var(--navy-300);
  transform: rotate(-45deg);
  transition: transform var(--dur) var(--ease);
  flex: none;
  margin-left: 2px;
}
.faq details[open] summary::before { transform: rotate(45deg); }
.faq summary:hover { background: var(--surface-2); }
.faq .ans { padding: 0 16px 14px 33px; color: var(--ink-2); font-size: 13.2px; }
.faq .ans p:last-child { margin-bottom: 0; }

.kbd {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 5px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  background: var(--surface-2);
  font-size: 11.8px;
  font-weight: 700;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* ------------------------------------------------------------------- misc */

.sec-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 26px 0 12px;
  font-size: 12.4px;
  font-weight: 750;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}
.sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sec-title:first-child { margin-top: 0; }

.list-editor { display: flex; flex-wrap: wrap; gap: 7px; }
.list-editor .tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 6px 5px 11px;
  border-radius: 999px;
  background: var(--bg-alt);
  border: 1px solid var(--line);
  font-size: 12.6px;
  font-weight: 600;
  animation: cardIn 260ms var(--ease) both;
}
.list-editor .tag button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  transition: background 140ms var(--ease), color 140ms var(--ease);
}
.list-editor .tag button:hover { background: rgba(180, 35, 24, .14); color: var(--danger); }
.list-editor .tag button svg { width: 12px; height: 12px; }

.mini-note { font-size: 12.2px; color: var(--muted); }
.hr { height: 1px; background: var(--line); margin: 18px 0; }
.flex { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.flex.end { justify-content: flex-end; }
.grow { flex: 1; }

.skel {
  background: linear-gradient(90deg, var(--bg-alt) 25%, var(--surface-2) 37%, var(--bg-alt) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s infinite linear;
  border-radius: 6px;
}
@keyframes shimmer { from { background-position: 100% 0 } to { background-position: -100% 0 } }

/* ----------------------------------------------------------------- kartu   */

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 13px; }
.id-card {
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.id-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.id-card .ic-h {
  background: linear-gradient(120deg, var(--navy), #24406f);
  color: #fff;
  padding: 7px 11px;
  font-size: 10.6px;
  font-weight: 750;
  letter-spacing: .05em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}
.id-card .ic-h img { width: 21px; height: 21px; object-fit: contain; }
.id-card .ic-b { display: grid; grid-template-columns: 62px 1fr; gap: 11px; padding: 11px; }
.id-card .ic-b img { width: 58px; height: 58px; object-fit: contain; align-self: center; }
.id-card .ic-row { display: grid; grid-template-columns: 62px 1fr; font-size: 11.8px; gap: 4px; }
.id-card .ic-row span:first-child { color: var(--muted); }
.id-card .ic-row span:last-child { font-weight: 620; word-break: break-word; }
.id-card .ic-f {
  border-top: 1px solid var(--line-2);
  padding: 5px 11px;
  font-size: 10.4px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}

/* ---------------------------------------------------------------- responsif */

@media (max-width: 940px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 262px;
    transform: translateX(-100%);
    transition: transform 280ms var(--ease);
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: none; }
  .menu-toggle { display: grid; }
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(9, 14, 26, .5);
    z-index: 19;
    animation: fadeIn 200ms var(--ease) both;
  }
  .scrim[hidden] { display: none; }
  .view { padding: 16px 14px 70px; }
  .form-grid { grid-template-columns: 1fr; }
  .topbar { padding: 11px 14px; }
  .topbar h1 { font-size: 15.5px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ================================================================= CETAK == */

#print-root { display: none; }

@media print {
  @page { size: A4 portrait; margin: 13mm 12mm 14mm; }
  @page landscape { size: A4 landscape; }

  html, body { overflow: visible !important; height: auto !important; background: #fff !important; }
  body { font-size: 10.5pt; color: #000; }
  .shell, .toasts, .overlay, .scrim { display: none !important; }

  #print-root { display: block !important; }

  .doc { color: #000; }
  .doc + .doc { page-break-before: always; }

  .doc-head {
    display: grid;
    grid-template-columns: 74px 1fr 74px;
    align-items: center;
    gap: 10px;
    border-bottom: 2.5px solid #16294b;
    padding-bottom: 7px;
    margin-bottom: 4px;
  }
  .doc-head img { width: 72px; height: 72px; object-fit: contain; }
  .doc-head .ttl { text-align: center; line-height: 1.28; }
  .doc-head .t1 { font-size: 15.5pt; font-weight: 800; letter-spacing: .02em; }
  .doc-head .t2 { font-size: 12.5pt; font-weight: 700; }
  .doc-head .t3 { font-size: 9.4pt; }
  .doc-head .t4 { font-size: 8.8pt; color: #333; }

  .doc-title {
    text-align: center;
    font-size: 12pt;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .03em;
    margin: 12px 0 3px;
  }
  .doc-sub { text-align: center; font-size: 9.4pt; color: #333; margin-bottom: 11px; }

  .doc-meta {
    display: grid;
    grid-template-columns: max-content 10px 1fr;
    gap: 1px 6px;
    font-size: 10pt;
    margin-bottom: 10px;
  }
  .doc-meta b { font-weight: 700; }

  table.doc-tbl { width: 100%; border-collapse: collapse; font-size: 9.6pt; }
  table.doc-tbl thead { display: table-header-group; }
  table.doc-tbl tr { page-break-inside: avoid; }
  table.doc-tbl th, table.doc-tbl td {
    border: 1px solid #7b8496;
    padding: 4.5px 6px;
    text-align: left;
    vertical-align: middle;
  }
  table.doc-tbl thead th {
    background: #16294b !important;
    color: #fff !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    font-size: 8.8pt;
    text-transform: uppercase;
    letter-spacing: .03em;
    text-align: center;
  }
  table.doc-tbl td.c { text-align: center; }
  table.doc-tbl td.nw { white-space: nowrap; }
  table.doc-tbl td.sig { height: 30px; }
  table.doc-tbl tbody tr:nth-child(even) td { background: #f4f6fa; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .doc-sign {
    margin-top: 26px;
    display: flex;
    justify-content: flex-end;
    page-break-inside: avoid;
  }
  .doc-sign .box { text-align: center; font-size: 10pt; min-width: 230px; }
  .doc-sign .nm { font-weight: 800; text-decoration: underline; margin-top: 62px; }

  .doc-foot {
    margin-top: 9px;
    font-size: 7.8pt;
    color: #555;
    display: flex;
    justify-content: space-between;
    border-top: .5px solid #bbb;
    padding-top: 4px;
  }

  /* kartu anggota */
  .kartu-sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
  .kartu {
    border: 1.2px solid #16294b;
    border-radius: 3mm;
    overflow: hidden;
    page-break-inside: avoid;
    height: 52mm;
    display: flex;
    flex-direction: column;
  }
  .kartu .kh {
    background: #16294b !important;
    color: #fff !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    font-size: 7.6pt;
    font-weight: 800;
    letter-spacing: .04em;
    padding: 2mm 3mm;
    text-align: center;
    text-transform: uppercase;
  }
  .kartu .kb { display: grid; grid-template-columns: 18mm 1fr; gap: 3mm; padding: 2.5mm 3mm; flex: 1; }
  .kartu .kb img { width: 17mm; height: 17mm; object-fit: contain; align-self: center; }
  .kartu .kr { display: grid; grid-template-columns: 15mm 1fr; font-size: 7.8pt; line-height: 1.5; }
  .kartu .kr span:first-child { color: #555; }
  .kartu .kr span:last-child { font-weight: 700; }
  .kartu .kf {
    border-top: .5px solid #99a; font-size: 6.6pt; color: #555;
    padding: 1mm 3mm; display: flex; justify-content: space-between;
  }
}

</style>

<script>
/* ==========================================================================
   Aplikasi Team Pemenangan — inti: data, penyimpanan, hitungan
   Semua data tersimpan di localStorage peramban. Tanpa server, tanpa internet.
   ========================================================================== */

'use strict';

const KEY = 'tp_app_v1';
const KEY_UI = 'tp_ui_v1';

const DEFAULTS = {
  identitas: {
    calon: 'JONI FAHAMSYAH',
    team: 'TEAM PEMENANGAN',
    periode: 'PERIODE 2026 S/D 2034',
    tahun: '2026',
    desa: 'SUKAKARYA',
    kecamatan: '',
    kabupaten: '',
    ketua: 'IDRUS KAMSENO',
    jabatanTtd: 'Ketua Team',
    motto: 'MELAYANI DENGAN HATI, MEMBANGUN DESA UNTUK NEGERI',
    driveUrl: 'https://drive.google.com/drive/folders/14LvBYSGaDkrgcI3R5iJ7mja2uyAj0rR8'
  },
  kadus: ['Kadus I', 'Kadus II', 'Kadus III', 'Kadus IV', 'Kadus V'],
  rt: ['001', '002', '003', '004', '005', '006', '007', '008', '009', '010',
    '011', '012', '013', '014', '015'],
  rw: ['001', '002', '003', '004', '005', '006', '007', '008'],
  ketuaRt: [],
  tps: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10'],
  jabatan: ['Ketua Team', 'Wakil Ketua', 'Sekretaris', 'Bendahara',
    'Koordinator Wilayah', 'Koordinator Lapangan', 'Anggota', 'Relawan'],
  status: ['Aktif', 'Calon', 'Nonaktif'],
  target: {},
  kelompokUsia: [
    { label: 'Di bawah 17 th', min: 0 },
    { label: 'Pemula 17-22 th', min: 17 },
    { label: 'Muda 23-35 th', min: 23 },
    { label: 'Dewasa 36-50 th', min: 36 },
    { label: 'Matang 51-65 th', min: 51 },
    { label: 'Senior 66 th +', min: 66 }
  ]
};

const FIELDS = ['nama', 'nik', 'jk', 'kadus', 'rt', 'rw', 'ketuaRt', 'tps',
  'jabatan', 'hp', 'alamat', 'tglLahir', 'status', 'tglGabung', 'perekrut',
  'catatan'];

/* ----------------------------------------------------------------- state */

let state = { members: [], settings: null, disimpan: '' };
let ui = {
  view: 'dasbor',
  theme: 'light',
  q: '',
  f: { kadus: '', rt: '', rw: '', ketuaRt: '', tps: '', jabatan: '', status: '' },
  sort: { by: 'nama', dir: 1 },
  page: 1,
  perPage: 25,
  cetak: { jenis: 'daftar', kadus: '', rt: '', rw: '', ketuaRt: '', tps: '', jabatan: '', status: '' },
  kartu: { kadus: '', rt: '', rw: '', ketuaRt: '' }
};

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function defaultSettings() {
  const s = clone(DEFAULTS);
  s.kadus.forEach(k => { s.target[k] = 50; });
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state.members = Array.isArray(d.members) ? d.members : [];
      state.disimpan = d.disimpan || '';
      state.settings = Object.assign(defaultSettings(), d.settings || {});
      // pastikan setiap daftar tetap array walau berkas cadangan lama
      ['kadus', 'rt', 'rw', 'ketuaRt', 'tps', 'jabatan', 'status'].forEach(k => {
        if (!Array.isArray(state.settings[k])) state.settings[k] = DEFAULTS[k].slice();
      });
      if (!state.settings.identitas) state.settings.identitas = clone(DEFAULTS.identitas);
      else state.settings.identitas = Object.assign(clone(DEFAULTS.identitas),
        state.settings.identitas);
      if (!state.settings.target) state.settings.target = {};
      if (!Array.isArray(state.settings.kelompokUsia) || !state.settings.kelompokUsia.length) {
        state.settings.kelompokUsia = clone(DEFAULTS.kelompokUsia);
      }
    } else {
      state.settings = defaultSettings();
      state.members = [];
    }
  } catch (e) {
    console.error('Gagal membaca data tersimpan:', e);
    state.settings = defaultSettings();
    state.members = [];
  }
  try {
    const rawUi = localStorage.getItem(KEY_UI);
    if (rawUi) ui = Object.assign(ui, JSON.parse(rawUi));
    if (!ui.f) ui.f = { kadus: '', rt: '', rw: '', ketuaRt: '', tps: '', jabatan: '', status: '' };
    if (!ui.cetak) ui.cetak = Object.assign({ jenis: 'daftar' }, { kadus: '', rt: '', rw: '', ketuaRt: '', tps: '', jabatan: '', status: '' });
    if (!ui.kartu) ui.kartu = { kadus: '', rt: '', rw: '', ketuaRt: '' };
  } catch (e) { /* pengaturan tampilan boleh gagal tanpa mengganggu data */ }
}

let saveTimer = null;
function save(now) {
  const write = () => {
    try {
      state.disimpan = new Date().toISOString();
      localStorage.setItem(KEY, JSON.stringify({
        v: 1, disimpan: state.disimpan,
        members: state.members, settings: state.settings
      }));
    } catch (e) {
      toast('Penyimpanan peramban penuh — segera unduh cadangan JSON.', 'err', 8000);
      console.error(e);
    }
  };
  if (now) { clearTimeout(saveTimer); write(); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(write, 250);
}

function saveUi() {
  try { localStorage.setItem(KEY_UI, JSON.stringify(ui)); } catch (e) { /* abaikan */ }
}

/* ------------------------------------------------------------- turunan */

function korwil(m) {
  if (!m.kadus) return '';
  if (m.rt) return m.kadus + ' - RT ' + m.rt + (m.rw ? '/' + m.rw : '');
  if (m.ketuaRt) return m.kadus + ' - RT ' + m.ketuaRt;
  return m.kadus;
}

/** Alamat lengkap yang sudah terpisah, untuk tampilan dan dokumen cetak. */
function wilayah(m) {
  const b = [];
  if (m.kadus) b.push(m.kadus);
  if (m.rt) b.push('RT ' + m.rt + (m.rw ? '/' + m.rw : ''));
  if (m.ketuaRt) b.push('(RT ' + m.ketuaRt + ')');
  return b.join(' ');
}

function usia(m, ref) {
  if (!m.tglLahir) return null;
  const d = new Date(m.tglLahir + 'T00:00:00');
  if (isNaN(d)) return null;
  const now = ref || new Date();
  let u = now.getFullYear() - d.getFullYear();
  const bln = now.getMonth() - d.getMonth();
  if (bln < 0 || (bln === 0 && now.getDate() < d.getDate())) u--;
  return u >= 0 && u < 130 ? u : null;
}

function kelompokUsia(u) {
  if (u === null || u === undefined) return '';
  const list = state.settings.kelompokUsia;
  let hit = list[0] ? list[0].label : '';
  for (const g of list) if (u >= g.min) hit = g.label;
  return hit;
}

/** Satu masalah utama per baris, berurutan menurut prioritas — sama seperti
 *  versi Excel supaya hasil kedua aplikasi bisa dibandingkan. */
function masalah(m, nikCount) {
  if (!m.nama || !m.nama.trim()) return 'Nama kosong';
  const nik = (m.nik || '').trim();
  if (!nik) return 'NIK kosong';
  if (!/^\d{16}$/.test(nik)) return 'NIK bukan 16 digit';
  if (nikCount && (nikCount[nik] || 0) > 1) return 'NIK ganda';
  if (!m.kadus) return 'Kampung kosong';
  if (!m.rt && !m.ketuaRt) return 'RT kosong';
  if (!m.jabatan) return 'Jabatan kosong';
  if (!(m.hp || '').trim()) return 'No. HP kosong';
  if (!(m.alamat || '').trim() && !wilayah(m)) return 'Alamat kosong';
  const u = usia(m);
  if (u !== null && u < 17) return 'Usia di bawah 17';
  return '';
}

function hitungNik() {
  const c = Object.create(null);
  for (const m of state.members) {
    const n = (m.nik || '').trim();
    if (n) c[n] = (c[n] || 0) + 1;
  }
  return c;
}

/* -------------------------------------------------------------- saringan */

function cocok(m, f, q) {
  if (f.kadus && m.kadus !== f.kadus) return false;
  if (f.rt && m.rt !== f.rt) return false;
  if (f.rw && m.rw !== f.rw) return false;
  if (f.ketuaRt && m.ketuaRt !== f.ketuaRt) return false;
  if (f.tps && m.tps !== f.tps) return false;
  if (f.jabatan && m.jabatan !== f.jabatan) return false;
  if (f.status && m.status !== f.status) return false;
  if (q) {
    const t = q.toLowerCase();
    const blob = [m.nama, m.nik, m.hp, m.alamat, m.perekrut, m.jabatan,
      wilayah(m), m.ketuaRt, m.tps, m.catatan].join(' ').toLowerCase();
    if (!blob.includes(t)) return false;
  }
  return true;
}

function saring(f, q) {
  return state.members.filter(m => cocok(m, f || ui.f, q === undefined ? ui.q : q));
}

function urut(list, by, dir) {
  const arr = list.slice();
  arr.sort((a, b) => {
    let x, y;
    if (by === 'usia') { x = usia(a); y = usia(b); x = x === null ? -1 : x; y = y === null ? -1 : y; }
    else if (by === 'korwil') { x = korwil(a); y = korwil(b); }
    else { x = a[by]; y = b[by]; }
    if (typeof x === 'number' || typeof y === 'number') return ((x || 0) - (y || 0)) * dir;
    return String(x || '').localeCompare(String(y || ''), 'id', { sensitivity: 'base' }) * dir;
  });
  return arr;
}

/* -------------------------------------------------------------- CRUD */

function uid() {
  return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function normalisasi(rec) {
  const m = {};
  FIELDS.forEach(k => { m[k] = (rec[k] === undefined || rec[k] === null) ? '' : String(rec[k]).trim(); });
  m.nama = m.nama.toUpperCase();
  m.nik = m.nik.replace(/\s+/g, '');
  m.hp = m.hp.replace(/[^\d+]/g, '');
  return m;
}

function tambah(rec) {
  const m = normalisasi(rec);
  m.id = uid();
  m.dibuat = new Date().toISOString();
  m.diubah = m.dibuat;
  state.members.push(m);
  save();
  return m;
}

function ubah(id, rec) {
  const i = state.members.findIndex(m => m.id === id);
  if (i < 0) return null;
  const m = Object.assign({}, state.members[i], normalisasi(rec));
  m.id = id;
  m.diubah = new Date().toISOString();
  state.members[i] = m;
  save();
  return m;
}

function hapus(id) {
  const i = state.members.findIndex(m => m.id === id);
  if (i < 0) return false;
  state.members.splice(i, 1);
  save();
  return true;
}

function cariById(id) { return state.members.find(m => m.id === id) || null; }

/* --------------------------------------------------------------- ringkas */

function ringkasan() {
  const ms = state.members;
  const nikC = hitungNik();
  const total = ms.length;
  const aktif = ms.filter(m => m.status === 'Aktif').length;
  const L = ms.filter(m => m.jk === 'L').length;
  const P = ms.filter(m => m.jk === 'P').length;
  const kadusAktif = new Set(ms.map(m => m.kadus).filter(Boolean)).size;
  const rtAktif = new Set(ms.map(m => m.rt).filter(Boolean)).size;
  const tpsAktif = new Set(ms.map(m => m.tps).filter(Boolean)).size;
  const usiaList = ms.map(m => usia(m)).filter(u => u !== null);
  const rataUsia = usiaList.length
    ? Math.round(usiaList.reduce((a, b) => a + b, 0) / usiaList.length) : null;
  const targetTotal = state.settings.kadus
    .reduce((a, k) => a + (Number(state.settings.target[k]) || 0), 0);
  const bermasalah = ms.filter(m => masalah(m, nikC)).length;
  return {
    total, aktif, L, P, kadusAktif, rtAktif, tpsAktif, rataUsia, targetTotal,
    capaian: targetTotal ? total / targetTotal : 0, bermasalah, nikC
  };
}

function perKadus() {
  return state.settings.kadus.map(k => {
    const anggota = state.members.filter(m => m.kadus === k);
    const target = Number(state.settings.target[k]) || 0;
    return {
      kadus: k,
      jumlah: anggota.length,
      aktif: anggota.filter(m => m.status === 'Aktif').length,
      L: anggota.filter(m => m.jk === 'L').length,
      P: anggota.filter(m => m.jk === 'P').length,
      target,
      capaian: target ? anggota.length / target : 0,
      kurang: Math.max(0, target - anggota.length)
    };
  });
}

function hitungPer(field) {
  const map = new Map();
  for (const m of state.members) {
    const v = field === 'korwil' ? korwil(m) : (m[field] || '');
    if (!v) continue;
    map.set(v, (map.get(v) || 0) + 1);
  }
  return map;
}

/* --------------------------------------------------------------- toast */

function toast(msg, jenis, ms) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (jenis || '');
  const ic = jenis === 'err' ? ICON.alert : (jenis === 'info' ? ICON.bulb : ICON.check);
  el.innerHTML = ic + '<div>' + esc(msg) + '</div>';
  box.appendChild(el);
  const t = setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 260);
  }, ms || 3200);
  el.addEventListener('click', () => { clearTimeout(t); el.remove(); });
}

function opts(list, sel, kosong) {

function filterBar(f, prefix, extra) {
  const s = state.settings;

    opts(list, f[k], kosong) + '</select>';

    sel('rt', s.rt, '— semua RT —') +

}

function labelFilter(f) {
  const b = [];
  if (f.kadus) b.push(f.kadus);

  else if (f.rw) b.push('RW ' + f.rw);

  if (f.tps) b.push('TPS ' + f.tps);

  const totalAll = state.members.length || 1;
  perKadus().forEach(x => {
    const a = state.members.filter(m => m.kadus === x.kadus);
    const c = st => a.filter(m => m.status === st).length;
    h += '<tr><td>' + esc(x.kadus) + '</td><td>' + x.L + '</td><td>' + x.P + '</td>' +
      '<td>' + c('Aktif') + '</td><td>' + c('Calon') + '</td><td>' + c('Nonaktif') + '</td>' +
      '<td><b>' + x.jumlah + '</b></td><td>' + pct(x.jumlah / totalAll) + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  const blok = (judul, map, kolom) => {
    let x = '<div class="sec-title">' + judul + '</div><div class="card"><div class="tbl-wrap">' +
      '<table class="tbl matrix"><thead><tr><th>' + kolom + '</th><th>Jumlah</th><th>% total</th>' +
      '<th style="width:34%">Sebaran</th></tr></thead><tbody>';
    const maks = Math.max(1, ...map.values());
    if (!map.size) {
      x += '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:22px">Belum ada data</td></tr>';
    }
    map.forEach((v, k) => {
      x += '<tr><td>' + esc(k) + '</td><td><b>' + num(v) + '</b></td><td>' + pct(v / totalAll) + '</td>' +
        '<td><span class="bar-track" style="display:block"><span class="bar-fill" data-w="' +
        ((v / maks) * 100) + '"></span></span></td></tr>';
    });
    return x + '</tbody></table></div></div>';
  };

  const sortMap = m => new Map(Array.from(m.entries()).sort((a, b) => b[1] - a[1]));
  h += blok('Rekap per jabatan', sortMap(hitungPer('jabatan')), 'Jabatan');
  h += blok('Sebaran per TPS', sortMap(hitungPer('tps')), 'TPS');
  h += blok('Rekap per korwil', sortMap(hitungPer('korwil')), 'Korwil');

  const um = new Map();
  state.settings.kelompokUsia.forEach(g => um.set(g.label, 0));
  state.members.forEach(m => {
    const g = kelompokUsia(usia(m));
    if (g) um.set(g, (um.get(g) || 0) + 1);
  });
  h += blok('Segmen usia pemilih', um, 'Kelompok usia');

  const perekrut = sortMap(hitungPer('perekrut'));
  if (perekrut.size) h += blok('Perekrut teraktif', perekrut, 'Nama perekrut');
  return h;
}

/* --------------------------------------------------------------- target */

function viewTarget() {
  const pk = perKadus();
  const totT = pk.reduce((a, x) => a + x.target, 0);
  const totJ = pk.reduce((a, x) => a + x.jumlah, 0);

  let h = '<div class="tip blue">' + ICON.bulb +
    '<div><b>Angka target diisi sendiri</b>, bukan hasil perhitungan. ' +
    'Ubah di <b>Pengaturan → Target per Kadus</b>.</div></div>';

  h += '<div class="card" style="margin-top:14px"><div class="tbl-wrap"><table class="tbl matrix">' +
    '<thead><tr><th>Kadus</th><th>Target</th><th>Realisasi</th><th>Aktif</th><th>Kurang</th>' +
    '<th>% capaian</th><th style="width:30%">Grafik</th></tr></thead><tbody>';
  pk.forEach(x => {
    const cls = x.capaian >= 1 ? 'g' : (x.capaian >= .5 ? 'a' : 'r');
    const warna = x.capaian >= 1 ? 'var(--green)' : (x.capaian >= .5 ? 'var(--amber)' : 'var(--red)');
    h += '<tr><td>' + esc(x.kadus) + '</td><td>' + num(x.target) + '</td>' +
      '<td><b>' + num(x.jumlah) + '</b></td><td>' + num(x.aktif) + '</td>' +
      '<td>' + num(x.kurang) + '</td>' +
      '<td style="color:' + warna + ';font-weight:750">' + (x.target ? pct(x.capaian) : '—') + '</td>' +
      '<td><span class="bar-track" style="display:block"><span class="bar-fill ' + cls +
      '" data-w="' + Math.min(100, x.capaian * 100) + '"></span></span></td></tr>';
  });
  h += '</tbody><tfoot><tr><td>TOTAL</td><td>' + num(totT) + '</td><td>' + num(totJ) + '</td>' +
    '<td>' + num(pk.reduce((a, x) => a + x.aktif, 0)) + '</td>' +
    '<td>' + num(Math.max(0, totT - totJ)) + '</td>' +
    '<td>' + (totT ? pct(totJ / totT) : '—') + '</td><td></td></tr></tfoot></table></div></div>';

  h += '<div class="flex" style="margin-top:14px;gap:16px">' +
    '<span class="chip aktif">Hijau: capaian ≥ 100%</span>' +
    '<span class="chip calon">Kuning: 50–99%</span>' +
    '<span class="chip bad">Merah: di bawah 50%</span></div>';
  return h;
}

/* ------------------------------------------------------------- validasi */

function viewValidasi() {
  const nikC = hitungNik();
  const daftar = state.members.map(m => ({ m, x: masalah(m, nikC) })).filter(o => o.x);
  const grup = new Map();
  daftar.forEach(o => grup.set(o.x, (grup.get(o.x) || 0) + 1));

  let h = '';
  if (!daftar.length) {
    h += '<div class="card"><div class="empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="opacity:1"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/></svg>' +
      '<h4>Semua data sudah lengkap</h4>' +
      '<p class="mini-note">Tidak ada NIK ganda, NIK pendek, atau kolom wajib yang kosong.</p></div></div>';
    return h;
  }

  h += '<div class="grid kpi-grid stagger">';
  grup.forEach((v, k) => {
    h += '<div class="kpi is-red"><div class="k-top">' + ICON.alert +
      '<span class="k-lab">' + esc(k) + '</span></div>' +
      '<div class="k-val" data-count="' + v + '">0</div>' +
      '<div class="k-sub">baris perlu diperbaiki</div></div>';
  });
  h += '</div>';

  h += '<div class="sec-title">Daftar baris yang perlu diperbaiki</div>' +
    '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    '<th style="width:44px">#</th><th>Nama</th><th>NIK</th><th>Korwil</th>' +
    '<th>Masalah</th><th style="width:96px">Aksi</th></tr></thead><tbody>';
  daftar.forEach((o, i) => {
    h += '<tr class="bad-row"><td class="num" style="color:var(--muted)">' + (i + 1) + '</td>' +
      '<td class="name">' + esc(o.m.nama || '(tanpa nama)') + '</td>' +
      '<td style="font-variant-numeric:tabular-nums">' + esc(o.m.nik || '—') + '</td>' +
      '<td>' + esc(wilayah(o.m) || '—') + '</td>' +
      '<td><span class="chip bad">' + esc(o.x) + '</span></td>' +
      '<td><button class="btn btn-sm btn-primary" data-edit="' + o.m.id + '">Perbaiki</button></td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

/* ==========================================================================
   Aplikasi Team Pemenangan — cetak & kartu anggota
   Dokumen dibangun ke #print-root lalu window.print(). Gaya cetak ada di
   blok @media print pada stylesheet.
   ========================================================================== */

'use strict';

const JENIS_DOK = {
  daftar: {
    judul: 'DAFTAR ANGGOTA TEAM PEMENANGAN',
    ket: 'Daftar lengkap dengan kolom tanda tangan'
  },
  hadir: {
    judul: 'DAFTAR HADIR KEGIATAN',
    ket: 'Absensi kegiatan, ada kolom kegiatan/tanggal/tempat'
  },
  rekap: {
    judul: 'REKAPITULASI ANGGOTA',
    ket: 'Ringkasan jumlah per Kadus, RT, TPS, jabatan, dan status'
  },
  kartu: {
    judul: 'KARTU ANGGOTA',
    ket: 'Kartu siap potong, 8 per halaman'
  }
};

function kopDok() {
  const id = state.settings.identitas;
  const wil = ['DESA ' + (id.desa || '-')];
  if (id.kecamatan) wil.push('KECAMATAN ' + id.kecamatan);
  if (id.kabupaten) wil.push('KABUPATEN ' + id.kabupaten);
  return '<div class="doc-head">' +
    '<img src="' + LOGO_EMBLEM + '" alt="">' +
    '<div class="ttl">' +
    '<div class="t1">' + esc(id.team || 'TEAM PEMENANGAN') + '</div>' +
    '<div class="t2">' + esc(id.calon || '') + '</div>' +
    '<div class="t3">' + esc(id.periode || '') + '</div>' +
    '<div class="t4">' + esc(wil.join(' • ')) + '</div>' +
    '</div><div></div></div>';
}

function ttdDok() {
  const id = state.settings.identitas;
  const hariIni = new Date().toLocaleDateString('id-ID',
    { day: 'numeric', month: 'long', year: 'numeric' });
  return '<div class="doc-sign"><div class="box">' +
    esc((id.desa || '') + ', ' + hariIni) +
    '<div style="margin-top:2px">' + esc(id.jabatanTtd || 'Ketua Team') + '</div>' +
    '<div class="nm">' + esc(id.ketua || '') + '</div>' +
    '</div></div>';
}

function footDok(info) {
  const id = state.settings.identitas;
  return '<div class="doc-foot"><span>' + esc(id.team || '') + ' — ' + esc(id.calon || '') +
    '</span><span>' + esc(info) + '</span></div>';
}

function metaDok(baris) {
  let h = '<div class="doc-meta">';
  baris.forEach(b => {
    h += '<b>' + esc(b[0]) + '</b><span>:</span><span>' + esc(b[1]) + '</span>';
  });
  return h + '</div>';
}

/** Bangun seluruh dokumen cetak sesuai jenis + filter aktif. */
function buatDokumen(jenis, f, ekstra) {
  const list = urut(saring(f, ''), 'kadus', 1);
  const lab = labelFilter(f);
  const tgl = new Date().toLocaleDateString('id-ID',
    { day: '2-digit', month: '2-digit', year: 'numeric' });

  if (jenis === 'kartu') return dokKartu(list);
  if (jenis === 'rekap') return dokRekap(list, lab, tgl);

  const hadir = jenis === 'hadir';
  const meta = hadir
    ? [['KEGIATAN', (ekstra && ekstra.kegiatan) || '.......................................'],
       ['HARI / TANGGAL', (ekstra && ekstra.tanggal) || '.......................................'],
       ['TEMPAT', (ekstra && ekstra.tempat) || '.......................................'],
       ['KELOMPOK', lab], ['JUMLAH', list.length + ' orang']]
    : [['KELOMPOK', lab], ['JUMLAH', list.length + ' orang'],
       ['DICETAK', tgl]];

  let h = '<div class="doc">' + kopDok() +
    '<div class="doc-title">' + esc(JENIS_DOK[jenis].judul) + '</div>' +
    '<div class="doc-sub">' + esc(state.settings.identitas.motto || '') + '</div>' +
    metaDok(meta);

  // lebar kolom harus berjumlah 100%, kalau lebih isi sel ikut membungkus
  const w = hadir
    ? { no: 5, nama: 30, nik: 18, korwil: 0, jab: 20, hp: 13, ttd: 14 }
    : { no: 5, nama: 24, nik: 16, korwil: 16, jab: 15, hp: 12, ttd: 12 };
  h += '<table class="doc-tbl"><thead><tr>' +
    '<th style="width:' + w.no + '%">No</th>' +
    '<th style="width:' + w.nama + '%">Nama Lengkap</th>' +
    '<th style="width:' + w.nik + '%">NIK</th>' +
    (hadir ? '' : '<th style="width:' + w.korwil + '%">Alamat</th>') +
    '<th style="width:' + w.jab + '%">Jabatan</th>' +
    '<th style="width:' + w.hp + '%">No. HP</th>' +
    '<th style="width:' + w.ttd + '%">Tanda Tangan</th></tr></thead><tbody>';

  if (!list.length) {
    h += '<tr><td colspan="' + (hadir ? 6 : 7) + '" class="c" style="padding:18px">' +
      'Tidak ada data untuk filter ini.</td></tr>';
  }
  list.forEach((m, i) => {
    h += '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(m.nama) + '</td>' +
      '<td class="c nw">' + esc(m.nik || '') + '</td>' +
      (hadir ? '' : '<td class="nw">' + esc(wilayah(m)) + '</td>') +
      '<td>' + esc(m.jabatan || '') + '</td><td class="c">' + esc(m.hp || '') + '</td>' +
      '<td class="sig">' + (i + 1) + '.</td></tr>';
  });
  h += '</tbody></table>' + ttdDok() +
    footDok('Dicetak ' + tgl + ' • ' + list.length + ' orang') + '</div>';
  return h;
}

function dokRekap(list, lab, tgl) {
  const s = state.settings;
  const rtAda = s.rt.filter(rt => list.some(m => m.rt === rt));
  let h = '<div class="doc">' + kopDok() +
    '<div class="doc-title">REKAPITULASI ANGGOTA TEAM PEMENANGAN</div>' +
    '<div class="doc-sub">' + esc(state.settings.identitas.motto || '') + '</div>' +
    metaDok([['KELOMPOK', lab], ['JUMLAH', list.length + ' orang'], ['DICETAK', tgl]]);

  h += '<table class="doc-tbl"><thead><tr><th>Kadus</th>';
  rtAda.forEach(rt => { h += '<th>RT ' + esc(rt) + '</th>'; });
  h += '<th>L</th><th>P</th><th>Aktif</th><th>Total</th></tr></thead><tbody>';
  s.kadus.forEach(k => {
    const a = list.filter(m => m.kadus === k);
    if (!a.length) return;
    h += '<tr><td>' + esc(k) + '</td>';
    rtAda.forEach(rt => { h += '<td class="c">' + a.filter(m => m.rt === rt).length + '</td>'; });
    h += '<td class="c">' + a.filter(m => m.jk === 'L').length + '</td>' +
      '<td class="c">' + a.filter(m => m.jk === 'P').length + '</td>' +
      '<td class="c">' + a.filter(m => m.status === 'Aktif').length + '</td>' +
      '<td class="c"><b>' + a.length + '</b></td></tr>';
  });
  h += '</tbody></table>';

  const tabel = (judul, map) => {
    if (!map.size) return '';
    let x = '<div class="doc-title" style="font-size:10.5pt;margin-top:14px">' + esc(judul) + '</div>' +
      '<table class="doc-tbl"><thead><tr><th style="width:60%">Kelompok</th>' +
      '<th>Jumlah</th><th>Persentase</th></tr></thead><tbody>';
    const tot = list.length || 1;
    map.forEach((v, k) => {
      x += '<tr><td>' + esc(k) + '</td><td class="c">' + v + '</td>' +
        '<td class="c">' + pct(v / tot) + '</td></tr>';
    });
    return x + '</tbody></table>';
  };
  const per = (field) => {
    const m = new Map();
    list.forEach(x => {
      const v = field === 'korwil' ? korwil(x) : (x[field] || '');
      if (v) m.set(v, (m.get(v) || 0) + 1);
    });
    return new Map(Array.from(m.entries()).sort((a, b) => b[1] - a[1]));
  };
  h += tabel('Rekap per TPS', per('tps'));
  h += tabel('Rekap per jabatan', per('jabatan'));
  h += tabel('Rekap per status', per('status'));

  h += ttdDok() + footDok('Dicetak ' + tgl) + '</div>';
  return h;
}

function dokKartu(list) {
  const id = state.settings.identitas;
  let h = '';
  for (let i = 0; i < list.length; i += 8) {
    const grup = list.slice(i, i + 8);
    h += '<div class="doc"><div class="kartu-sheet">';
    grup.forEach((m, j) => {
      h += '<div class="kartu">' +
        '<div class="kh">' + esc(id.team || '') + ' — ' + esc(id.calon || '') + '</div>' +
        '<div class="kb"><img src="' + LOGO_EMBLEM + '" alt="">' +
        '<div>' +
        '<div class="kr"><span>NAMA</span><span>' + esc(m.nama) + '</span></div>' +
        '<div class="kr"><span>NIK</span><span>' + esc(m.nik || '-') + '</span></div>' +
        '<div class="kr"><span>ALAMAT</span><span>' + esc(wilayah(m) || '-') + '</span></div>' +
        '<div class="kr"><span>JABATAN</span><span>' + esc(m.jabatan || '-') + '</span></div>' +
        '<div class="kr"><span>NO. HP</span><span>' + esc(m.hp || '-') + '</span></div>' +
        '</div></div>' +
        '<div class="kf"><span>No. ' + (i + j + 1) + '</span><span>' + esc(id.periode || '') + '</span></div>' +
        '</div>';
    });
    h += '</div></div>';
  }
  if (!list.length) {
    h = '<div class="doc">' + kopDok() +
      '<div class="doc-title">KARTU ANGGOTA</div>' +
      '<p style="text-align:center">Tidak ada data untuk filter ini.</p></div>';
  }
  return h;
}

function cetakSekarang(jenis, f, ekstra) {
  const root = $('#print-root');
  root.innerHTML = buatDokumen(jenis, f, ekstra);
  // beri jeda satu frame supaya gambar & tata letak selesai sebelum dialog cetak
  requestAnimationFrame(() => {
    setTimeout(() => window.print(), 60);
  });
}

  h += '<div class="hr"></div><div class="flex">' +

function viewKartu() {
  const k = ui.kartu;
  const list = saring(k, '');
  let h = '<div class="card"><div class="card-b">' + filterBar(k, 'kartu', false) +

    '<div><div style="font-weight:750;font-size:15px">' + esc(labelFilter(k)) + '</div>' +

  }

  h += '<div class="card-grid stagger" style="margin-top:16px">';
  list.slice(0, 60).forEach((m, i) => {
    const id = state.settings.identitas;
    h += '<div class="id-card"><div class="ic-h"><img src="' + LOGO_EMBLEM + '" alt="">' +
      '<span>' + esc(id.team || '') + '</span></div>' +
      '<div class="ic-b"><img src="' + LOGO_EMBLEM + '" alt="">' +
      '<div>' +
      '<div class="ic-row"><span>NAMA</span><span>' + esc(m.nama) + '</span></div>' +
      '<div class="ic-row"><span>NIK</span><span>' + esc(m.nik || '-') + '</span></div>' +
      '<div class="ic-row"><span>KORWIL</span><span>' + esc(korwil(m) || '-') + '</span></div>' +
      '<div class="ic-row"><span>JABATAN</span><span>' + esc(m.jabatan || '-') + '</span></div>' +
      '<div class="ic-row"><span>NO. HP</span><span>' + esc(m.hp || '-') + '</span></div>' +
      '</div></div>' +
      '<div class="ic-f"><span>No. ' + (i + 1) + '</span><span>' + esc(id.periode || '') + '</span></div>' +
      '</div>';
  });
  h += '</div>';
  if (list.length > 60) {
    h += '<p class="mini-note" style="margin-top:12px">Pratinjau dibatasi 60 kartu; ' +
      'seluruh ' + num(list.length) + ' kartu tetap ikut tercetak.</p>';
  }
  return h;
}

/* ==========================================================================
   Aplikasi Team Pemenangan — paket data offline (ZIP) & database bawaan

   Peramban menolak fetch() ke berkas tetangga saat halaman dibuka lewat
   file:// (kebijakan CORS). Yang tetap diizinkan adalah memuat berkas lewat
   tag <script>, jadi database paket disimpan sebagai data/database.js yang
   mengisi window.TP_DATA. Cara ini bekerja tanpa server sama sekali.
   ========================================================================== */

'use strict';

/* --------------------------------------------------------- penulis ZIP */

const CRC_TABEL = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABEL[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

async function kempis(data) {
  if (typeof CompressionStream === 'undefined') return null;
  try {
    const aliran = new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    const hasil = new Uint8Array(await new Response(aliran).arrayBuffer());
    return hasil.length < data.length ? hasil : null;
  } catch (e) {
    return null;                       // peramban lama: simpan tanpa kompresi
  }
}

/** Bangun berkas ZIP dari [{nama, data:Uint8Array}] — tanpa pustaka luar. */
async function buatZip(berkas) {
  const enc = new TextEncoder();
  const bagian = [];
  const pusat = [];
  const kini = new Date();
  const jam = ((kini.getHours() << 11) | (kini.getMinutes() << 5) |
    (kini.getSeconds() >> 1)) & 0xFFFF;
  const tgl = (((kini.getFullYear() - 1980) << 9) | ((kini.getMonth() + 1) << 5) |
    kini.getDate()) & 0xFFFF;
  let posisi = 0;

  for (const f of berkas) {
    const nama = enc.encode(f.nama);
    const crc = crc32(f.data);
    const padat = await kempis(f.data);
    const keluar = padat || f.data;
    const metode = padat ? 8 : 0;

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);      // nama berkas UTF-8
    lh.setUint16(8, metode, true);
    lh.setUint16(10, jam, true);
    lh.setUint16(12, tgl, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, keluar.length, true);
    lh.setUint32(22, f.data.length, true);
    lh.setUint16(26, nama.length, true);
    lh.setUint16(28, 0, true);
    bagian.push(new Uint8Array(lh.buffer), nama, keluar);

    pusat.push({ nama, crc, padat: keluar.length, asli: f.data.length, metode, posisi });
    posisi += 30 + nama.length + keluar.length;
  }

  const awalPusat = posisi;
  for (const c of pusat) {
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, c.metode, true);
    ch.setUint16(12, jam, true);
    ch.setUint16(14, tgl, true);
    ch.setUint32(16, c.crc, true);
    ch.setUint32(20, c.padat, true);
    ch.setUint32(24, c.asli, true);
    ch.setUint16(28, c.nama.length, true);
    ch.setUint32(42, c.posisi, true);
    bagian.push(new Uint8Array(ch.buffer), c.nama);
    posisi += 46 + c.nama.length;
  }

  const akhir = new DataView(new ArrayBuffer(22));
  akhir.setUint32(0, 0x06054b50, true);
  akhir.setUint16(8, pusat.length, true);
  akhir.setUint16(10, pusat.length, true);
  akhir.setUint32(12, posisi - awalPusat, true);
  akhir.setUint32(16, awalPusat, true);
  bagian.push(new Uint8Array(akhir.buffer));

  return new Blob(bagian, { type: 'application/zip' });
}

/* ------------------------------------------------------- isi paket ZIP */

function isiDatabase() {
  return {
    aplikasi: 'Aplikasi Team Pemenangan',
    v: 1,
    disimpan: new Date().toISOString(),
    settings: state.settings,
    members: state.members
  };
}

/** Salinan aplikasi yang bisa langsung dibuka, diambil dari DOM saat ini. */
function salinanAplikasi() {
  const doc = document.documentElement.cloneNode(true);
  doc.setAttribute('data-theme', 'light');
  doc.querySelectorAll('.view').forEach(v => { v.innerHTML = ''; });
  ['#print-root', '#toasts'].forEach(s => {
    const el = doc.querySelector(s);
    if (el) el.innerHTML = '';
  });
  const ov = doc.querySelector('#overlay');
  if (ov) { ov.setAttribute('hidden', ''); const m = ov.querySelector('#modal'); if (m) m.innerHTML = ''; }
  const sb = doc.querySelector('#sidebar');
  if (sb) sb.classList.remove('open');
  const sc = doc.querySelector('#scrim');
  if (sc) sc.setAttribute('hidden', '');
  // tag skrip database yang disuntik saat berjalan tidak ikut disalin —
  // aplikasi akan menyuntiknya lagi sendiri ketika dibuka
  doc.querySelectorAll('script[data-bawaan]').forEach(s => s.remove());
  return '<!doctype html>\n' + doc.outerHTML;
}

-------

`;

async function unduhPaketZip() {
  const tombol = $('#btnZip');
  if (tombol) { tombol.disabled = true; tombol.textContent = 'Menyiapkan paket…'; }
  try {
    const enc = new TextEncoder();
    const data = isiDatabase();
    const json = JSON.stringify(data, null, 2);
    const berkas = [
      { nama: 'Aplikasi Team Pemenangan.html', data: enc.encode(salinanAplikasi()) },
      { nama: 'data/database.js', data: enc.encode('window.TP_DATA = ' + json + ';\n') },
      { nama: 'data/database.json', data: enc.encode(json) },
      { nama: 'BACA-DULU.txt', data: enc.encode(BACA_DULU) }
    ];
    const zip = await buatZip(berkas);
    const url = URL.createObjectURL(zip);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Aplikasi-Team-Pemenangan-' + stamp() + '.zip';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 600);
    toast('Paket ZIP terunduh — berisi aplikasi + ' + num(state.members.length) +
      ' anggota.', 'ok', 5000);
  } catch (e) {
    console.error(e);
    toast('Paket gagal dibuat: ' + e.message, 'err', 6000);
  } finally {
    if (tombol) { tombol.disabled = false; tombol.textContent = 'Unduh paket ZIP'; }
  }
}

function muatBawaan(selesai) {
  const s = document.createElement('script');
  s.src = 'data/database.js';
  s.dataset.bawaan = '1';
  s.onload = () => selesai(true);
  s.onerror = () => selesai(false);   // dibuka tanpa folder data — wajar
  document.head.appendChild(s);
}

function gabungAnggota(masuk) {
  const adaNik = new Set(state.members.map(m => m.nik).filter(Boolean));
  const adaId = new Set(state.members.map(m => m.id));
  let tambahJml = 0, lewat = 0;
  masuk.forEach(r => {
    const m = normalisasi(r);
    m.id = adaId.has(r.id) || !r.id ? uid() : r.id;
    m.dibuat = r.dibuat || new Date().toISOString();
    m.diubah = new Date().toISOString();
    if (m.nik && adaNik.has(m.nik)) { lewat++; return; }
    if (m.nik) adaNik.add(m.nik);
    adaId.add(m.id);
    state.members.push(m);
    tambahJml++;
  });
  return { tambahJml, lewat };
}

function pakaiPaket(d) {
  state.members = (d.members || []).map(r => {
    const m = normalisasi(r);
    m.id = r.id || uid();
    m.dibuat = r.dibuat || new Date().toISOString();
    m.diubah = r.diubah || m.dibuat;
    return m;
  });
  if (d.settings) state.settings = Object.assign(defaultSettings(), d.settings);
  save(true);
}

/** Terapkan database bawaan paket, tanpa pernah menimpa data diam-diam. */
function terapkanBawaan(d) {
  if (!d || !Array.isArray(d.members) || !d.members.length) return;

  if (!state.members.length) {
    pakaiPaket(d);
    render();
    toast('Database dari paket dimuat: ' + num(state.members.length) + ' anggota.',
      'info', 5000);
    return;
  }

  const tPaket = Date.parse(d.disimpan || '') || 0;
  const tLokal = Date.parse(state.disimpan || '') || 0;
  if (tPaket <= tLokal) return;        // data perangkat sama baru atau lebih baru

  const tglPaket = d.disimpan ? tglId(d.disimpan) : 'tanpa tanggal';
  const tglLokal = state.disimpan ? tglId(state.disimpan) : 'tanpa tanggal';
  bukaModal('<div class="modal-h"><h3>Paket berisi data lebih baru</h3><div class="grow"></div>' +
    '<button class="icon-btn" data-close="1">' + ICON.x + '</button></div>' +
    '<div class="modal-b">' +
    '<p>Folder <b>data</b> di sebelah aplikasi berisi database yang lebih baru ' +
    'daripada yang tersimpan di perangkat ini.</p>' +
    '<div class="grid two" style="margin:14px 0">' +
    '<div class="card"><div class="card-b"><div class="mini-note">DARI PAKET</div>' +
    '<div style="font-size:22px;font-weight:800">' + num(d.members.length) + ' anggota</div>' +
    '<div class="mini-note">' + esc(tglPaket) + '</div></div></div>' +
    '<div class="card"><div class="card-b"><div class="mini-note">DI PERANGKAT INI</div>' +
    '<div style="font-size:22px;font-weight:800">' + num(state.members.length) + ' anggota</div>' +
    '<div class="mini-note">' + esc(tglLokal) + '</div></div></div>' +
    '</div><p class="mini-note">Tidak ada yang diubah sampai Anda memilih.</p></div>' +
    '<div class="modal-f"><button class="btn" data-close="1">Pertahankan data perangkat</button>' +
    '<button class="btn" id="btnGabung">Gabungkan</button>' +
    '<button class="btn btn-primary" id="btnPakaiPaket">Gunakan data paket</button></div>');

  $('#btnPakaiPaket').addEventListener('click', () => {
    pakaiPaket(d);
    tutupModal();
    render();
    toast('Data paket dipakai: ' + num(state.members.length) + ' anggota.');
  });
  $('#btnGabung').addEventListener('click', () => {
    const { tambahJml, lewat } = gabungAnggota(d.members);
    save(true);
    tutupModal();
    render();
    toast('Ditambahkan ' + num(tambahJml) + ' anggota' +
      (lewat ? ', ' + num(lewat) + ' dilewati karena NIK sudah ada.' : '.'));
  });
}

function unduh(nama, isi, mime) {
  const blob = new Blob([isi], { type: mime || 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nama;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}

function stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

function exportJson() {
  unduh('team-pemenangan-' + stamp() + '.json', JSON.stringify({
    aplikasi: 'Aplikasi Team Pemenangan', v: 1,

    settings: state.settings, members: state.members

  toast('Cadangan JSON terunduh — unggah ke folder Drive Anda.');
}

const CSV_KOLOM = ['nama', 'nik', 'jk', 'kadus', 'rt', 'rw', 'ketuaRt', 'tps',
  'jabatan', 'hp', 'alamat', 'tglLahir', 'status', 'tglGabung', 'perekrut',
  'catatan'];

function csvCell(v) {
  const s = String(v === undefined || v === null ? '' : v);
  return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCsv(list) {
  const rows = [CSV_KOLOM.join(',')];
  (list || state.members).forEach(m => {
    rows.push(CSV_KOLOM.map(k => csvCell(m[k])).join(','));
  });
  unduh('team-pemenangan-' + stamp() + '.csv', '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
  toast('CSV terunduh (' + num((list || state.members).length) + ' baris).');
}

function parseCsv(teks) {
  const baris = [];
  let cur = [], nilai = '', dalam = false;
  const t = teks.replace(/^﻿/, '');
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (dalam) {
      if (c === '"') {
        if (t[i + 1] === '"') { nilai += '"'; i++; } else dalam = false;
      } else nilai += c;
    } else if (c === '"') dalam = true;
    else if (c === ',' || c === ';') { cur.push(nilai); nilai = ''; }
    else if (c === '\n') { cur.push(nilai); baris.push(cur); cur = []; nilai = ''; }
    else if (c !== '\r') nilai += c;
  }
  if (nilai !== '' || cur.length) { cur.push(nilai); baris.push(cur); }
  return baris.filter(b => b.some(v => String(v).trim() !== ''));
}

function importFile(file, gabung) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const teks = String(fr.result);
      let masuk = [];
      let setelan = null;
      if (/\.json$/i.test(file.name) || teks.trim().startsWith('{')) {
        const d = JSON.parse(teks);
        masuk = Array.isArray(d.members) ? d.members : (Array.isArray(d) ? d : []);
        if (d.settings) setelan = d.settings;
      } else {
        const baris = parseCsv(teks);
        if (baris.length < 2) throw new Error('CSV tidak berisi data');
        const kepala = baris[0].map(x => x.trim().toLowerCase());
        const petaAlias = {
          'nama lengkap': 'nama', 'nik (16 digit)': 'nik', 'l/p': 'jk',
          'no. hp': 'hp', 'no hp': 'hp', 'tgl lahir': 'tglLahir',
          'kampung': 'kadus', 'ketua rt': 'ketuaRt',
          'tgl gabung': 'tglGabung', 'kelompok usia': null, 'usia': null,
          'korwil': null, 'no': null, 'key': null
        };
        const idx = kepala.map(k => {
          if (Object.prototype.hasOwnProperty.call(petaAlias, k)) return petaAlias[k];
          const bersih = k.replace(/[^a-z]/g, '');
          const cocokKol = CSV_KOLOM.find(c => c.toLowerCase() === bersih);
          return cocokKol || null;
        });
        for (let i = 1; i < baris.length; i++) {
          const rec = {};
          idx.forEach((kol, j) => { if (kol) rec[kol] = baris[i][j]; });
          if ((rec.nama || '').trim()) masuk.push(rec);
        }
      }
      if (!masuk.length) { toast('Tidak ada baris yang bisa dibaca dari berkas itu.', 'err'); return; }

      const bersih = masuk.map(r => {
        const m = normalisasi(r);
        m.id = r.id || uid();
        m.dibuat = r.dibuat || new Date().toISOString();
        m.diubah = new Date().toISOString();
        return m;
      });

      if (gabung) {
        const adaNik = new Set(state.members.map(m => m.nik).filter(Boolean));
        const adaId = new Set(state.members.map(m => m.id));
        let tambahJml = 0, lewat = 0;
        bersih.forEach(m => {
          if (adaId.has(m.id)) m.id = uid();
          if (m.nik && adaNik.has(m.nik)) { lewat++; return; }
          if (m.nik) adaNik.add(m.nik);
          state.members.push(m);
          tambahJml++;
        });
        toast('Ditambahkan ' + num(tambahJml) + ' anggota' +
          (lewat ? ', ' + num(lewat) + ' dilewati karena NIK sudah ada.' : '.'));
      } else {
        state.members = bersih;
        if (setelan) state.settings = Object.assign(defaultSettings(), setelan);
        toast('Data dipulihkan: ' + num(bersih.length) + ' anggota.');
      }
      save(true);
      render();
    } catch (e) {
      console.error(e);
      toast('Berkas gagal dibaca: ' + e.message, 'err', 6000);
    }
  };
  fr.onerror = () => toast('Berkas gagal dibuka.', 'err');
  fr.readAsText(file);
}

function validasiForm(form, idSekarang) {
  let ok = true;
  const setBad = (nama, pesan) => {
    const f = form.querySelector('[data-f="' + nama + '"]');
    if (!f) return;
    f.classList.add('bad');
    const e = f.querySelector('.err');
    if (e && pesan) e.textContent = pesan;
    ok = false;
  };
  $$('.field', form).forEach(f => f.classList.remove('bad'));

  const nama = form.nama.value.trim();
  if (!nama) setBad('nama', 'Nama wajib diisi.');

  const nik = form.nik.value.trim();
  if (nik) {
    if (!/^\d+$/.test(nik)) setBad('nik', 'NIK hanya boleh angka.');
    else if (nik.length !== 16) setBad('nik', 'NIK harus tepat 16 angka (sekarang ' + nik.length + ').');
    else {
      const kembar = state.members.some(m => m.nik === nik && m.id !== idSekarang);
      if (kembar) setBad('nik', 'NIK ini sudah dipakai anggota lain.');
    }
  }
  return ok;
}

/** Jalankan animasi bar & angka setelah elemen masuk DOM. */
function animasi(root) {
  requestAnimationFrame(() => {
    $$('[data-w]', root).forEach(b => { b.style.width = b.dataset.w + '%'; });
    $$('[data-h]', root).forEach(b => { b.style.height = b.dataset.h + '%'; });
    $$('[data-dash]', root).forEach(c => {
      c.setAttribute('stroke-dasharray', c.dataset.dash + ' 289');
    });
    $$('[data-count]', root).forEach(el => {
      // KPI bernilai teks (misal "1,2%" atau "—") ditandai data-count kosong;
      // jangan disentuh, kalau tidak isinya berubah jadi 0
      if (el.dataset.count === '') return;
      const akhir = Number(el.dataset.count);
      if (!akhir || akhir < 0) { el.textContent = num(akhir || 0); return; }
      const mulai = performance.now();
      const durasi = Math.min(900, 260 + akhir * 6);
      const step = t => {
        const p = Math.min(1, (t - mulai) / durasi);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = num(Math.round(akhir * e));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  });
}
