<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="__LOGO_EMBLEM__" alt="Emblem team pemenangan">
      <div class="txt">
        <div class="t1" id="brandTeam">Team Pemenangan</div>
        <div class="t2" id="brandCalon">—</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-label">Utama</div>
      <button data-view="dasbor" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dasbor
      </button>
      <button data-view="data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        Data Anggota
        <span class="badge" id="navCount" hidden>0</span>
      </button>
      <button data-view="rekap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Rekap &amp; Analisa
      </button>
      <button data-view="target">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></svg>
        Target &amp; Capaian
      </button>
      <button data-view="validasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8.5 4.5v5c0 5-3.6 8.6-8.5 9.8C7.1 21.1 3.5 17.5 3.5 12.5v-5z"/><path d="M9.3 12.3l1.9 1.9 3.6-3.9"/></svg>
        Validasi Data
        <span class="badge" id="navIssues" hidden>0</span>
      </button>

      <div class="nav-label">Cetak</div>
      <button data-view="cetak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 15h12v6H6z"/></svg>
        Cetak Daftar
      </button>
      <button data-view="kartu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2.2"/><path d="M5 16.4c.7-1.6 2-2.4 3.5-2.4s2.8.8 3.5 2.4M14.5 10h4M14.5 13.5h4"/></svg>
        Kartu Anggota
      </button>

      <div class="nav-label">Sistem</div>
      <button data-view="pengaturan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        Pengaturan
      </button>
      <button data-view="data-io">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
        Cadangan &amp; Drive
      </button>
      <button data-view="petunjuk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 0 1 4.8.8c0 1.7-2.4 2.2-2.4 3.6"/><path d="M12 17.2h.01"/></svg>
        Petunjuk
      </button>
    </nav>

    <div class="side-foot">
      <span class="dot"></span>
      <span>Tersimpan di perangkat ini</span>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Buka menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h1 id="pageTitle">Dasbor</h1>
        <div class="sub" id="pageSub">Ringkasan data team pemenangan</div>
      </div>
      <div class="grow"></div>
      <button class="btn btn-primary" id="btnAddTop" title="Tambah anggota baru">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="teks-tombol">Tambah Anggota</span>
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="Ganti tema" title="Terang / gelap">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <div class="view-wrap" id="viewWrap">
      <section class="view" id="view-dasbor"></section>
      <section class="view" id="view-data" hidden></section>
      <section class="view" id="view-rekap" hidden></section>
      <section class="view" id="view-target" hidden></section>
      <section class="view" id="view-validasi" hidden></section>
      <section class="view" id="view-cetak" hidden></section>
      <section class="view" id="view-kartu" hidden></section>
      <section class="view" id="view-pengaturan" hidden></section>
      <section class="view" id="view-data-io" hidden></section>
      <section class="view" id="view-petunjuk" hidden></section>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toasts" id="toasts"></div>
<div id="print-root"></div>
